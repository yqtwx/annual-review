<script>

document.getElementById('catalog-button').onclick=e=>openPanel('项目与作品索引',(data.project_index||[]).map(p=>({heading:p.name,text:[p.description,p.status].filter(Boolean).join(' · '),locator:'证据：'+((p.evidence_ids||[]).join(' / ')||'项目登记')})),e.currentTarget);document.getElementById('dialog-close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});dialog.addEventListener('close',()=>restoreFocus?.focus({preventScroll:true}));
const pages=[...report.children];let current=0;const animations=new Map();
function finishCounts(){for(const [n,id] of animations){cancelAnimationFrame(id);n.textContent=formatNumber(Number(n.dataset.value),Number(n.dataset.scale),Number(n.dataset.decimals))}animations.clear()}
function count(n){if(paused||n.dataset.played==='1')return;n.dataset.played='1';const start=performance.now(),value=Number(n.dataset.value),scale=Number(n.dataset.scale),decimals=Number(n.dataset.decimals);function frame(now){const x=Math.min(1,(now-start)/1500);n.textContent=formatNumber(value*(1-Math.pow(1-x,3)),scale,decimals);if(x<1)animations.set(n,requestAnimationFrame(frame));else animations.delete(n)}animations.set(n,requestAnimationFrame(frame))}
function mark(i){current=i;document.getElementById('counter').textContent=String(i+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');document.getElementById('progress').style.width=(i+1)/pages.length*100+'%';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===pages.length-1;pages[i].classList.add('is-visible');pages[i].querySelectorAll('.count').forEach(count)}
function go(delta){const i=Math.max(0,Math.min(pages.length-1,current+delta));pages[i].focus({preventScroll:true});pages[i].scrollIntoView({behavior:paused?'auto':'smooth',block:'start'});mark(i)}
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.addEventListener('keydown',e=>{if(dialog.open||e.target.closest('button,input,textarea,select,a,summary,[contenteditable]'))return;if(['ArrowDown','ArrowUp','PageDown','PageUp'].includes(e.key)){e.preventDefault();go(['ArrowDown','PageDown'].includes(e.key)?1:-1)}});
let scheduled=false;document.addEventListener('scroll',()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;const middle=innerHeight*.45;let best=0,dist=Infinity;pages.forEach((p,i)=>{const r=p.getBoundingClientRect();const distance=r.top<=middle&&r.bottom>=middle?0:Math.min(Math.abs(r.top-middle),Math.abs(r.bottom-middle));if(distance<dist){dist=distance;best=i}});mark(best)})},{passive:true});
const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){entry.target.classList.add('is-visible');entry.target.querySelectorAll('.count').forEach(count)}},{threshold:.3});pages.forEach(p=>observer.observe(p));
function applyMotion(){document.body.classList.toggle('motion',!paused);if(paused)finishCounts()}
reduced.addEventListener('change',()=>{paused=reduced.matches;applyMotion()});window.addEventListener('beforeprint',finishCounts);applyMotion();mark(0);
